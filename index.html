<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 PetShop Kucing & Anjing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- ===== NAVBAR ===== -->
    <nav>
        <div class="logo">🐾 <span>Pet</span>Shop</div>
        <ul class="nav-links">
            <li>🏠 Beranda</li>
            <li>🐶 Hewan</li>
            <li>🛒 Produk</li>
            <li>📞 Kontak</li>
        </ul>
        <button class="cart-badge" id="cartBtn">
            🛒 Keranjang
            <span id="cartCount">0</span>
        </button>
    </nav>

    <!-- ===== HERO ===== -->
    <div class="hero">
        <h1>🐕 Selamat Datang di <span>PetShop</span> 🐈</h1>
        <p>Segala kebutuhan anabul kesayanganmu ada di sini! Klik <strong>Beli</strong> untuk tambah ke keranjang.</p>
    </div>

    <!-- ===== JUDUL PRODUK ===== -->
    <div class="section-title">✨ Produk Unggulan</div>

    <!-- ===== GRID PRODUK (diisi oleh JavaScript) ===== -->
    <div class="product-grid" id="productGrid"></div>

    <!-- ===== FOOTER ===== -->
    <footer>
        © 2026 PetShop Kucing & Anjing — Dibuat dengan ❤️ tanpa database
    </footer>
</div>

<!-- ===== TOAST ===== -->
<div id="toast">✅ Produk ditambahkan!</div>
<script src="script.js"></script>
</body>
</html>
